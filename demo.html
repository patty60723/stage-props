<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標籤顯示 A/B 測試（示範）</title>
<style>
:root{--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--accent:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:#f6f5f2;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 2px}
.muted{color:var(--mute);font-size:13px}
main{max-width:1300px;margin:0 auto;padding:12px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid}
.card h2{font-size:16px;margin:0 0 2px}
.card svg{width:100%;height:auto;display:block;margin-top:6px}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line);font-size:13px}
.num{display:inline-block;min-width:22px;text-align:center;border-radius:99px;color:#fff;padding:0 6px;font-size:12px}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:12px}
@media print{body{background:#fff}.noprint{display:none!important}main{padding:0}.card{border:none;padding:0 0 12px}.pgb{break-before:page}}
</style>
</head>
<body>
<header class="noprint"><h1>標籤顯示 A/B 測試（示範頁）</h1>
<div class="muted">比較「道具太小、名字放不下」時的幾種顯示方式。這一頁只讀取資料，不會寫入或修改任何東西。</div></header>
<main>
<div class="bar noprint">
  <label>資料來源<select id="src"></select></label>
  <label>事件<select id="ev"></select></label>
  <label>場景<select id="sc"></select></label>
  <div><div class="muted" style="margin-bottom:2px">檢視</div><div class="views" id="views"></div></div>
  <button class="primary" id="print" style="margin-left:auto">列印目前檢視</button>
</div>
<div id="status" class="note noprint"></div>
<div id="out" class="grid"></div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
import { fromDocs } from './diff.js';
const SRC = { theatre: { label: '劇場提供', color: '#3b82f6' }, personal: { label: '個人提供', color: '#f59e0b' }, actor: { label: '演員', color: '#10b981' } };
const ORDER = { theatre: 0, personal: 1, actor: 2 };
const FONT = "system-ui,'Noto Sans TC','Microsoft JhengHei',sans-serif";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const psize = p => p.source === 'actor' ? { w: .5, d: .5 } : { w: p.w, d: p.d };
const VIEWS = [['all', '並排比較'], ['cur', '現況'], ['out', 'A 標籤外移'], ['num', 'B 編號＋圖例'], ['fit', 'C 縮字換行'], ['mix', 'D C＋B 混合']];
const TITLES = { cur: ['現況', '放不下就截斷成「…」'], out: ['A　標籤外移', '放得進方塊就放裡面；放不下的移到旁邊，用細線連回道具'], num: ['B　編號＋圖例', '方塊內只放編號，名稱列在下方對照表（同一種道具共用編號）'], fit: ['C　縮字換行', '字級縮到剛好塞進方塊、必要時分兩行；仍太小才截斷'],
  mix: ['D　C＋B 混合', '字塞得進（夠大、看得清）就直接寫名字；太小的才改標編號，只有這些小道具列在對照表'] };

/* ---------- 範例資料（含很多小道具、長名字） ---------- */
function sample() {
  const P = (id, name, source, owner, w, d) => ({ id, name, source, owner, w, d, notes: '' });
  const props = [P('p1', '椅子', 'theatre', '', .45, .45), P('p2', '小圓桌', 'theatre', '', .8, .8), P('p3', '落地式麥克風架', 'theatre', '', .3, .3),
    P('p4', '譜架', 'personal', '小明', .5, .4), P('p5', '電子琴與延音踏板', 'personal', '阿花', .7, .35), P('p6', '手提音響', 'personal', '王小美麗', .3, .25),
    P('p7', '小明', 'actor', '小明', .5, .5), P('p8', '阿花', 'actor', '阿花', .5, .5), P('p9', '王小美麗', 'actor', '王小美麗', .5, .5)];
  const pl = (propId, x, y, rot = 0, i) => ({ id: 'x' + i + propId, propId, x, y, rot, t: i });
  const placements = [pl('p1', 1.2, 2, 0, 1), pl('p1', 1.8, 2, 0, 2), pl('p1', 2.4, 2, 0, 3), pl('p1', 3, 2, 0, 4), pl('p1', 3.6, 2, 0, 5), pl('p2', 6, 1.4, 0, 6),
    pl('p3', 4.6, 3.8, 0, 7), pl('p4', 2.2, 4.2, 20, 8), pl('p5', 5.6, 4.6, 0, 9), pl('p6', 6.6, 3.2, 0, 10), pl('p7', 4, 3.1, 0, 11), pl('p8', 4.7, 3.1, 0, 12), pl('p9', 7.2, 4.6, 0, 13)];
  return { stages: [{ id: 's', name: '示範舞台', w: 8, d: 6 }], props, events: [{ id: 'e', name: '範例事件', date: '2026-01-01', stageId: 's' }], scenes: [{ id: 'c', eventId: 'e', owner: '示範場景（很擠、名字很長）', title: '', t: 1, placements }] };
}

/* ---------- 繪圖 ---------- */
const aabb = (x, y, w, d, rot) => { const r = rot * Math.PI / 180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r)); return { x, y, w: w * c + d * s, h: w * s + d * c }; };
const hit = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
const halo = fs => `paint-order="stroke" stroke="#fff" stroke-width="${fs * .28}" stroke-linejoin="round"`;
function build(D, ev, sc, mode) {
  const st = D.stages.find(s => s.id === ev.stageId), P = id => D.props.find(p => p.id === id);
  const { w, d } = st, m = 0.9, fs = Math.max(w, d) * 0.025;
  const items = sc.placements.map(pl => ({ pl, p: P(pl.propId) })).filter(x => x.p).map(x => ({ ...x, sz: psize(x.p), c: SRC[x.p.source].color }));
  const fitLabel = (i, b, minF) => {                        // 回傳 {lines, f}；縮到 minF 還塞不下則回傳 null
    const W = Math.max(b.w, i.sz.w) * .94, H = Math.max(b.h, i.sz.d) * .94, ch = [...i.p.name], n = ch.length;
    for (const rows of [1, 2, 3]) { const per = Math.ceil(n / rows), f = Math.min(fs, W / per, H / (rows * 1.15));
      if (f >= minF) return { f, lines: Array.from({ length: rows }, (_, r) => ch.slice(r * per, (r + 1) * per).join('')).filter(Boolean) }; }
    return null;
  };
  const MIXMIN = fs * .7;
  const bx0 = items.map(i => aabb(i.pl.x, i.pl.y, i.sz.w, i.sz.d, i.pl.rot || 0));
  const isSmall = items.map((i, k) => mode === 'mix' && !fitLabel(i, bx0[k], MIXMIN));
  const numItems = mode === 'mix' ? items.filter((_, k) => isSmall[k]) : items;
  const nums = new Map(); [...new Map(numItems.map(i => [i.p.id, i.p])).values()].sort((a, b) => ORDER[a.source] - ORDER[b.source] || a.name.localeCompare(b.name, 'zh-Hant')).forEach((p, i) => nums.set(p.id, i + 1));
  let g = '';
  for (let i = 1; i < w; i++) g += `<line x1="${i}" y1="0" x2="${i}" y2="${d}" stroke="#e5e7eb" stroke-width="${fs * .08}"/>`;
  for (let j = 1; j < d; j++) g += `<line x1="0" y1="${j}" x2="${w}" y2="${j}" stroke="#e5e7eb" stroke-width="${fs * .08}"/>`;
  g += `<rect width="${w}" height="${d}" fill="none" stroke="#374151" stroke-width="${fs * .2}"/>`;
  g += `<text x="0" y="${-fs * .8}" font-size="${fs * 1.1}" font-weight="600" fill="#111827">${esc(ev.name)}　${esc(ev.date)}　<tspan fill="#7c3aed">${esc(sc.owner)}</tspan></text>`;
  g += `<text x="${w / 2}" y="${d + fs * 2.4}" font-size="${fs * 1.1}" fill="#6b7280" text-anchor="middle">▼ 觀眾席</text>`;
  const boxes = items.map(i => aabb(i.pl.x, i.pl.y, i.sz.w, i.sz.d, i.pl.rot || 0));
  const shapes = items.map(i => {
    const sw = fs * .15, t = `translate(${i.pl.x} ${i.pl.y}) rotate(${i.pl.rot || 0})`;
    return i.p.source === 'actor' ? `<ellipse transform="${t}" rx="${i.sz.w / 2}" ry="${i.sz.d / 2}" fill="${i.c}" fill-opacity=".3" stroke="${i.c}" stroke-width="${sw}"/>`
      : `<rect transform="${t}" x="${-i.sz.w / 2}" y="${-i.sz.d / 2}" width="${i.sz.w}" height="${i.sz.d}" rx="${fs * .15}" fill="${i.c}" fill-opacity=".25" stroke="${i.c}" stroke-width="${sw}"/>`;
  });
  g += shapes.join('');
  const lines = [], labels = [], lw = (t, f) => [...t].length * f;
  items.forEach((i, k) => {
    const { x, y } = i.pl, b = boxes[k], name = i.p.name, num = nums.get(i.p.id);
    const text = (t, cx, cy, f, extra = '') => `<text x="${cx}" y="${cy + f * .35}" font-size="${f}" text-anchor="middle" fill="#111827" ${halo(f)} ${extra}>${esc(t)}</text>`;
    if (mode === 'cur') {
      const maxc = Math.max(2, Math.floor(Math.max(i.sz.w, i.sz.d) / fs)), t = name.length > maxc ? name.slice(0, maxc - 1) + '…' : name;
      labels.push(text(t, x, y, fs));
    } else if (mode === 'num' || (mode === 'mix' && isSmall[k])) {
      labels.push(text(String(num), x, y, Math.min(fs * 1.1, Math.min(b.w, b.h) * .8)));
    } else if (mode === 'mix') {
      const r = fitLabel(i, b, MIXMIN); labels.push(r.lines.map((l, q) => text(l, x, y + (q - (r.lines.length - 1) / 2) * r.f * 1.15, r.f)).join(''));
    } else if (mode === 'fit') {
      const W = Math.max(b.w, i.sz.w) * .94, H = Math.max(b.h, i.sz.d) * .94, n = [...name].length, minF = fs * .5;
      let done = false;
      for (const rows of [1, 2, 3]) {
        const per = Math.ceil(n / rows), f = Math.min(fs, W / per, H / (rows * 1.15));
        if (f >= minF) { const ch = [...name]; const ls = Array.from({ length: rows }, (_, r) => ch.slice(r * per, (r + 1) * per).join('')).filter(Boolean);
          labels.push(ls.map((l, r) => text(l, x, y + (r - (ls.length - 1) / 2) * f * 1.15, f)).join('')); done = true; break; }
      }
      if (!done) { const per = Math.max(1, Math.floor(W / minF)), t = n > per ? [...name].slice(0, per - 1).join('') + '…' : name; labels.push(text(t, x, y, minF)); }
    } else { // out
      const L = lw(name, fs), H = fs * 1.35;
      if (L <= b.w * .92 && H <= b.h) { labels.push(text(name, x, y, fs)); return; }
      const hw = b.w / 2, hh = b.h / 2, gap = fs * .5, lwid = L + fs * .7, cands = [];
      for (const kk of [1, 2.4]) cands.push([x + hw + gap * kk + lwid / 2, y], [x - hw - gap * kk - lwid / 2, y], [x, y - hh - gap * kk - H / 2], [x, y + hh + gap * kk + H / 2],
        [x + hw + gap * kk + lwid / 2, y - hh - H * kk], [x - hw - gap * kk - lwid / 2, y - hh - H * kk], [x + hw + gap * kk + lwid / 2, y + hh + H * kk], [x - hw - gap * kk - lwid / 2, y + hh + H * kk]);
      const ok = ([px, py]) => px - lwid / 2 > -m + .05 && px + lwid / 2 < w + m - .05 && py - H / 2 > -fs * .3 && py + H / 2 < d + fs * 1.9;
      const free = c => ok(c) && !boxes.some(o => hit({ x: c[0], y: c[1], w: lwid, h: H }, o));
      const [px, py] = cands.find(free) || cands.find(ok) || cands[0];
      boxes.push({ x: px, y: py, w: lwid, h: H });
      lines.push(`<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" stroke="#6b7280" stroke-width="${fs * .08}"/>`);
      labels.push(`<rect x="${px - lwid / 2}" y="${py - H / 2}" width="${lwid}" height="${H}" rx="${fs * .2}" fill="#fff" fill-opacity=".92" stroke="${i.c}" stroke-width="${fs * .08}"/>` + text(name, px, py, fs));
    }
  });
  g += lines.join('') + labels.join('');
  const vb = [-m, -fs * 3.4, w + 2 * m, d + fs * 7.4];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" font-family="${FONT}"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fff"/>${g}</svg>`;
  let legend = '';
  if (mode === 'num' || (mode === 'mix' && numItems.length)) {
    const cnt = {}; numItems.forEach(i => cnt[i.p.id] = (cnt[i.p.id] || 0) + 1);
    legend = (mode === 'mix' ? `<div class="muted" style="margin-top:6px">圖中以編號標示的小道具（字放不下）：${nums.size ? '' : '無'}</div>` : '') + `<table><tr><th>編號</th><th>道具</th><th>類別</th><th>提供者</th><th>數量</th></tr>${[...nums.entries()].map(([id, n]) => { const p = P(id); return `<tr><td><span class="num" style="background:${SRC[p.source].color}">${n}</span></td><td>${esc(p.name)}</td><td>${SRC[p.source].label}</td><td>${esc(p.source === 'theatre' ? '劇場' : p.owner)}</td><td>${cnt[id]}</td></tr>`; }).join('')}</table>`;
  }
  return svg + legend;
}

/* ---------- 資料與介面 ---------- */
const $ = id => document.getElementById(id);
let D = sample(), view = 'all', live = null;
const st = { src: 'sample', ev: null, sc: null };
function fill() {
  const evs = D.events.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (!evs.some(e => e.id === st.ev)) st.ev = evs[0]?.id;
  $('ev').innerHTML = evs.map(e => `<option value="${e.id}"${e.id === st.ev ? ' selected' : ''}>${esc((e.date || '') + ' ' + e.name)}</option>`).join('');
  const scs = D.scenes.filter(s => s.eventId === st.ev).sort((a, b) => (a.t || 0) - (b.t || 0));
  if (!scs.some(s => s.id === st.sc)) st.sc = scs[0]?.id;
  $('sc').innerHTML = scs.map(s => `<option value="${s.id}"${s.id === st.sc ? ' selected' : ''}>${esc(s.owner + (s.title ? '・' + s.title : ''))}</option>`).join('');
  $('views').innerHTML = VIEWS.map(([k, l]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('');
  draw();
}
function draw() {
  const ev = D.events.find(e => e.id === st.ev), sc = D.scenes.find(s => s.id === st.sc);
  if (!ev || !sc || !D.stages.find(s => s.id === ev.stageId)) { $('out').innerHTML = '<div class="card">沒有可顯示的場景。</div>'; return; }
  const modes = view === 'all' ? ['cur', 'out', 'num', 'fit', 'mix'] : [view];
  $('out').className = 'grid' + (view === 'all' ? ' two' : '');
  $('out').innerHTML = modes.map((m, i) => `<div class="card${i && view !== 'all' ? ' pgb' : ''}"><h2>${TITLES[m][0]}</h2><div class="muted noprint">${TITLES[m][1]}</div>${build(D, ev, sc, m)}</div>`).join('');
}
$('src').innerHTML = '<option value="live">即時資料（唯讀）</option><option value="sample">範例資料（含很小的道具）</option>';
$('src').onchange = e => { st.src = e.target.value; D = st.src === 'live' && live ? live : sample(); setStatus(); fill(); };
$('ev').onchange = e => { st.ev = e.target.value; st.sc = null; fill(); };
$('sc').onchange = e => { st.sc = e.target.value; draw(); };
$('views').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { view = b.dataset.v; fill(); } };
$('print').onclick = () => window.print();
function setStatus(msg) {
  $('status').innerHTML = msg || (st.src === 'live' ? '目前顯示的是班級的<b>即時資料</b>（唯讀，這一頁不會修改它）。' : '目前顯示的是<b>範例資料</b>，內含很多小道具與長名字，方便比較。');
}

/* 即時資料：沿用主網頁已儲存的班級代碼，只讀不寫 */
async function loadLive() {
  const cfg = window.FIREBASE_CONFIG; let code = null;
  try { code = new URLSearchParams(location.hash.slice(1)).get('c') || localStorage.getItem('stage-props-code'); } catch { }
  if (!cfg || !/^[A-Za-z0-9_-]{6,40}$/.test(code || '')) { $('src').value = 'sample'; st.src = 'sample'; return setStatus('沒有找到班級代碼，先顯示範例資料。請先在主網頁輸入過班級代碼，或在網址後加上 #c=代碼。'); }
  setStatus('讀取即時資料中…');
  const got = {}, data = { stages: [], props: [], events: [], scenes: [] };
  try {
    const { connect } = await import('./sync.js');
    connect(cfg, code, {
      onData(name, docs) { data[name] = fromDocs(name, docs); got[name] = true; if (['stages', 'props', 'events', 'scenes'].every(k => got[k])) { live = data; if (st.src === 'live') { D = live; fill(); } } },
      onError(err) { console.error(err); setStatus('讀取即時資料失敗（' + esc(err.code || err.message) + '），改用範例資料。'); st.src = 'sample'; $('src').value = 'sample'; D = sample(); fill(); },
    });
  } catch (e) { setStatus('讀取即時資料失敗，改用範例資料。'); st.src = 'sample'; $('src').value = 'sample'; }
}
$('src').value = 'sample'; setStatus(); fill(); loadLive().then(() => { if (live || st.src === 'live') return; });
// 取得到即時資料後，預設切到即時資料
const wait = setInterval(() => { if (live) { clearInterval(wait); if (st.src === 'sample' && !window.__userPicked) { st.src = 'live'; $('src').value = 'live'; D = live; setStatus(); fill(); } } }, 200);
$('src').addEventListener('change', () => { window.__userPicked = true; });
</script>
</body>
</html>
